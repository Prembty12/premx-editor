name: Master Direct Streamer

on:
  workflow_dispatch:
    inputs:
      video_url:
        description: 'Direct Video URL (Leave blank to use auto-rotation)'
        required: false
        default: ''
      audio_url:
        description: 'Optional Audio URL (Leave blank if not needed)'
        required: false
        default: ''
      fb_key:
        description: 'Facebook Stream Key (Optional - Leave blank to use Secrets)'
        required: false
        default: ''
      yt_key:
        description: 'YouTube Stream Key (Optional - Leave blank to use Secrets)'
        required: false
        default: ''
      stream_mode:
        description: 'Platform [both, fb, yt]'
        required: true
        default: 'fb'
      loop_count:
        description: 'Loop [0=Once, 2=Twice, 10=10 Times, 24h/24=24 Hours]'
        required: true
        default: '0'
      ratio:
        description: 'Crop Ratio [1=1:1, 2=4:5, 3=9:16, 4=3:4, 5=4:3]'
        required: true
        default: '3'
      filter:
        description: 'Filter [1=Pop, 2=Vivid, 3=Cyber, 4=Night, 5=Cinematic, 6=HDR]'
        required: true
        default: '2'
      speed:
        description: 'Speed [1=Normal, 2=1.05x, 3=1.10x, 4=1.25x, 5=1.5x, 6=0.8x]'
        required: true
        default: '1'
      fps:
        description: 'FPS [1=30, 2=60]'
        required: true
        default: '1'
      bitrate:
        description: 'Bitrate [12, 16, 18] (Mbps)'
        required: true
        default: '12'
      gap_minutes:
        description: 'Gap before stream starts (Minutes)'
        required: true
        default: '2'

jobs:
  stream:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Cache APT Packages
        uses: actions/cache@v4
        with:
          path: /var/cache/apt/archives
          key: ${{ runner.os }}-apt-v1
          restore-keys: |
            ${{ runner.os }}-apt-

      - name: Setup Python & Cache Pip
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install System Dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg curl python3-pip jq

      - name: Install Python Dependencies
        run: |
          pip install yt-dlp requests

      - name: Run Master Streamer
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          
          # Secrets Fallback
          YOUTUBE_STREAM_KEY:  "${{ secrets.YOUTUBE_STREAM_KEY }}"
          FACEBOOK_STREAM_KEY: "${{ secrets.FACEBOOK_STREAM_KEY }}"
          
          # 🔥 Manual Keys (Inputs)
          MANUAL_FB_KEY: "${{ inputs.fb_key }}"
          MANUAL_YT_KEY: "${{ inputs.yt_key }}"
          
          # Inputs Mapping
          MANUAL_VIDEO_URL: "${{ inputs.video_url }}"
          AUDIO_URL:        "${{ inputs.audio_url }}"
          
          STREAM_MODE:    "${{ inputs.stream_mode }}"
          LOOP_COUNT:     "${{ inputs.loop_count }}"
          RATIO:          "${{ inputs.ratio }}"
          FILTER:         "${{ inputs.filter }}"
          SPEED:          "${{ inputs.speed }}"
          FPS:            "${{ inputs.fps }}"
          BITRATE:        "${{ inputs.bitrate }}"
          STREAM_GAP_MIN: "${{ inputs.gap_minutes }}"
        run: python RTMP.py

      - name: Commit Streamed Links (Safe - No Videos)
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          
          git add "*.txt" "*.json" "*.md" || true
          git add game_links_livestream/ game_links_streamed/ Manual_links/ gaming_runtime_v8/ || true
          git reset "*.mp4" || true
          
          git commit -m "🤖 Stream Complete [skip ci]" || echo "No changes to commit"
          git pull --rebase origin main || true
          git push || true
