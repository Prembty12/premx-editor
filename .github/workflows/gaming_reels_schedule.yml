name: gaming_reels_schedule

on:
  workflow_dispatch:
  schedule:
    - cron: '*/3 * * * *' # Har 5 minutes mein background mein check karega

jobs:
  auto-run:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python & Cache
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'
          
      - name: Install Dependencies & FFmpeg
        run: |
          sudo apt-get update && sudo apt-get install -y ffmpeg
          pip install Pillow requests

      - name: Run Fully Automated Grid Script
        env:
          GEMINI_API_KEY_1: ${{ secrets.GEMINI_API_KEY_1 }}
          GEMINI_API_KEY_2: ${{ secrets.GEMINI_API_KEY_2 }}
          GEMINI_API_KEY_3: ${{ secrets.GEMINI_API_KEY_3 }}
          PAGE_ACCESS_TOKEN: ${{ secrets.PAGE_ACCESS_TOKEN }}
          PAGE_ID: ${{ secrets.PAGE_ID }}
          IG_ID: ${{ secrets.IG_ID }}
          POST_MODE: 'ig_only'
          COOLDOWN_MINUTES: '300' # 👈 Yahan se aap cooldown control kar sakte hain (jaise 300 minutes = 5 hours)
        run: |
          bash auto_gemini_grid_pipeline_schedule.sh

      - name: Commit & Push Changes Back to Repository
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "🤖 Fully automated grid analysis, posting & local cooldown sync"
          branch: main
