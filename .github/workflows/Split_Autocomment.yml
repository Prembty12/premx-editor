name: SplitAutocomment Workflow

on:
  schedule:
   ## - cron: '0 */12 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-gaming-agent:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2
          fetch-tags: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install Python Packages
        run: |
          python -m pip install --upgrade pip --quiet
          pip install --quiet requests Pillow matplotlib reportlab

      - name: Run Split Auto-Comment & Dashboard
        env:
          PAGE_ACCESS_TOKEN: ${{ secrets.PAGE_ACCESS_TOKEN }}
          PAGE_ID: ${{ secrets.PAGE_ID }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENROUTER_API_KEY_2: ${{ secrets.OPENROUTER_API_KEY_2 }}
          OPENROUTER_API_KEY_3: ${{ secrets.OPENROUTER_API_KEY_3 }}
          OPENROUTER_API_KEY_4: ${{ secrets.OPENROUTER_API_KEY_4 }}
          OPENROUTER_API_KEY_5: ${{ secrets.OPENROUTER_API_KEY_5 }}
          AUTO_COMMENT: 'true'
        run: |
          python SplitAutocomment.py

      - name: Commit and Push Updated Logs & Dashboard
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add logs/ GAMING_DASHBOARD.md || true
          git commit -m "🤖 Auto-Agent: Update logs & dashboard [skip ci]" || echo "No changes"
          git pull --rebase origin main || echo "Pull failed"
          git push || echo "Nothing to push"
