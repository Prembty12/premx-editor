name: Autonomous Gaming Agent Workflow

on:
  schedule:
    - cron: '0 */12 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-gaming-agent:
  
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install System Dependencies (FFmpeg & Build Tools)
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg jq curl

      - name: Install Python Packages
        run: |
          pip install --upgrade pip
          pip install requests Pillow python-dotenv

      - name: Make Shell Scripts Executable
        run: |
          chmod +x run.sh loop.sh fallback.sh

      - name: Run Master Pipeline
        env:
          # ── Gemini Keys
          GEMINI_API_KEY_1: ${{ secrets.GEMINI_API_KEY_1 }}
          GEMINI_API_KEY_2: ${{ secrets.GEMINI_API_KEY_2 }}
          GEMINI_API_KEY_3: ${{ secrets.GEMINI_API_KEY_3 }}
          GEMINI_API_KEY_4: ${{ secrets.GEMINI_API_KEY_4 }}
          GEMINI_API_KEY_5: ${{ secrets.GEMINI_API_KEY_5 }}
          GEMINI_API_KEY_6: ${{ secrets.GEMINI_API_KEY_6 }}

          # ── Facebook / Instagram
          PAGE_ACCESS_TOKEN: ${{ secrets.PAGE_ACCESS_TOKEN }}
          PAGE_ID: ${{ secrets.PAGE_ID }}
          IG_ID: ${{ secrets.IG_ID }}
          FB_C_USER: ${{ secrets.FB_C_USER }}
          FB_XS: ${{ secrets.FB_XS }}
          POST_MODE: '2'

          # ── GitHub
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

          # ── OpenRouter (fallback brain + commentary script)
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENROUTER_API_KEY_2: ${{ secrets.OPENROUTER_API_KEY_2 }}
          OPENROUTER_API_KEY_3: ${{ secrets.OPENROUTER_API_KEY_3 }}
          OPENROUTER_API_KEY_4: ${{ secrets.OPENROUTER_API_KEY_4 }}
          OPENROUTER_API_KEY_5: ${{ secrets.OPENROUTER_API_KEY_5 }}

          # ── 🎙️ COMMENTARY KEYS
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          VOICE_ID: ${{ secrets.VOICE_ID }}

          # ── 🎚️ MASTER SWITCHES (true / false)
          COMMENTARY_ENABLED: 'true'       # 🎙️ AI commentary dub ON/OFF
          AUTO_COMMENT: 'true'             # 🤖 Auto-reply ON/OFF
          DEBUG: '1'                       # 🐛 Verbose logs

        run: |
          bash run.sh

      - name: Commit and Push Updated Memory & Posted Logs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add logs/ posted_links_editor/ game_links_editor/ temp_frames/ || true
          git commit -m "🤖 Auto-Agent: Update memory, insights, and shift posted links [skip ci]" || echo "No changes to commit"
          git push || echo "Nothing to push"
