name: Auto Stream Video Editor (PremxGamer HD)

on:
  workflow_dispatch:
    inputs:
      video_url:
        description: '1. Main Video URL (2K/YouTube Link or Direct Link)'
        required: true
        default: ''
      audio_url:
        description: '2. Optional: Direct MP3/Audio URL'
        required: false
        default: ''
      sound_video_url:
        description: '3. Optional: Video Link to Extract Sound from and Merge'
        required: false
        default: ''
      video_title:
        description: 'Exact File Name Prefix'
        required: true
        default: 'cod'
      game_name:
        description: 'Game Name for File Creation'
        required: true
        default: 'newcod'
      ratio:
        description: 'Crop Ratio [0=None, 1=1:1, 2=4:5, 3=9:16, 4=3:4, 5=4:3]'
        required: true
        default: '3'
      filter:
        description: 'Filter [0=OFF, 1=BALANCED, 2=GAMING, 3=FPS BOOST, 4=NIGHT MAP, 5=CINEMATIC, 6=ULTRA SHARP]'
        required: true
        default: '2'
      speed:
        description: 'Video Speed [1=Normal, 2=Fast, 3=Super Fast, 4=Slow]'
        required: true
        default: '1'
      clip_count:
        description: 'Kitne clips banane hain?'
        required: true
        default: '3'
      clip_len:
        description: 'Har clip kitne second ka ho?'
        required: true
        default: '15'
      fps:
        description: 'FPS [1=30, 2=60]'
        required: true
        default: '2'

jobs:
  process-video:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fast Install FFmpeg & Tools
        run: |
          echo "⚡ Fast installing required packages..."
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg curl wget
          sudo curl -sL https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp -o /usr/local/bin/yt-dlp
          sudo chmod a+rx /usr/local/bin/yt-dlp

      - name: Fetch Video, Audio and Extract/Merge Sound
        run: |
          VIDEO_URL="${{ github.event.inputs.video_url }}"
          AUDIO_URL="${{ github.event.inputs.audio_url }}"
          SOUND_VIDEO_URL="${{ github.event.inputs.sound_video_url }}"
          
          echo "📥 Downloading main video..."
          if echo "$VIDEO_URL" | grep -qE "youtube\.com|youtu\.be"; then
            yt-dlp -f "bestvideo+bestaudio/best" --merge-output-format mp4 "$VIDEO_URL" -o "input_video.mp4"
          else
            curl -L "$VIDEO_URL" -o "input_video.mp4"
          fi

          if [ -n "$AUDIO_URL" ]; then
            curl -L "$AUDIO_URL" -o "input_audio.mp3"
            ffmpeg -y -i "input_video.mp4" -i "input_audio.mp3" -c:v copy -c:a aac -map 0:v:0 -map 1:a:0 -shortest "merged_video.mp4"
            mv "merged_video.mp4" "input_video.mp4"
          fi

          if [ -n "$SOUND_VIDEO_URL" ]; then
            echo "🔊 Extracting sound..."
            if echo "$SOUND_VIDEO_URL" | grep -qE "youtube\.com|youtu\.be"; then
              yt-dlp -f "bestaudio/best" "$SOUND_VIDEO_URL" -o "sound_source.mp4"
            else
              curl -L "$SOUND_VIDEO_URL" -o "sound_source.mp4"
            fi
            ffmpeg -y -i "input_video.mp4" -i "sound_source.mp4" -c:v copy -c:a aac -map 0:v:0 -map 1:a:0 -shortest "merged_video.mp4"
            mv "merged_video.mp4" "input_video.mp4"
          fi

      - name: Process Clips with PremxGamer Metadata
        run: |
          TITLE_INPUT="${{ github.event.inputs.video_title }}"
          CLIP_COUNT=${{ github.event.inputs.clip_count }}
          CLIP_LEN=${{ github.event.inputs.clip_len }}
          TAG_NAME="v1.0.${{ github.run_number }}"
          
          META="PremxGamer_HD_$(date +%Y%m%d)"
          
          gh release create "$TAG_NAME" --title "Clips Rendered: $TITLE_INPUT" --notes "Created by PremxGamer" || true

          for ((i=1; i<=CLIP_COUNT; i++)); do
            SS=$(( (i-1) * CLIP_LEN ))
            CLIP_FILE="${TITLE_INPUT}${i}.mp4"
            
            ffmpeg -y -ss $SS -t $CLIP_LEN -i "input_video.mp4" \
              -metadata artist="PremxGamer" \
              -metadata comment="$META" \
              -metadata title="${TITLE_INPUT}_${i}" \
              -c:v libx264 -crf 18 -preset fast -pix_fmt yuv420p \
              -c:a aac -b:a 128k "$CLIP_FILE"

            gh release upload "$TAG_NAME" "$CLIP_FILE" --clobber
            rm -f "$CLIP_FILE"
          done
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Save Video Links with Game Name File
        run: |
          GAME_NAME="${{ github.event.inputs.game_name }}"
          TITLE_INPUT="${{ github.event.inputs.video_title }}"
          CLIP_COUNT=${{ github.event.inputs.clip_count }}
          TAG_NAME="v1.0.${{ github.run_number }}"
          
          mkdir -p game_links
          FILE_PATH="game_links/${GAME_NAME}.txt"
          
          for ((i=1; i<=CLIP_COUNT; i++)); do
            RELEASE_URL="https://github.com/${{ github.repository }}/releases/download/${TAG_NAME}/${TITLE_INPUT}${i}.mp4"
            echo "${GAME_NAME}${i} | Link: ${RELEASE_URL}" >> "$FILE_PATH"
          done
          
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add game_links/
          git commit -m "Add links for ${GAME_NAME}" || echo "No changes"
          git push
