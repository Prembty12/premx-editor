name: Auto Stream Video Editor (PremxGamer HD)

on:
  workflow_dispatch:
    inputs:
      video_url:
        description: 'Video URL (YouTube Link or Direct MP4 Link)'
        required: true
        default: ''
      video_title:
        description: 'File Name Prefix (e.g. cod -> cod1.mp4, cod2.mp4)'
        required: true
        default: 'cod'
      game_name:
        description: 'Game Name for History List (e.g. newcod)'
        required: true
        default: 'newcod'
      ratio:
        description: 'Crop Ratio [0=None, 1=1:1, 2=4:5, 3=9:16, 4=3:4, 5=4:3]'
        required: true
        default: '3'
      filter:
        description: 'Filter [0=OFF, 1=BALANCED, 2=GAMING, 3=FPS BOOST, 4=NIGHT MAP, 5=CINEMATIC, 6=ULTRA SHARP]'
        required: true
        default: '2'
      speed:
        description: 'Video Speed [1=Normal (1x), 2=Fast (1.25x), 3=Super Fast (1.5x), 4=Slow Motion (0.8x)]'
        required: true
        default: '1'
      clip_count:
        description: 'Kitne clips banane hain?'
        required: true
        default: '3'
      clip_len:
        description: 'Har clip kitne second ka ho?'
        required: true
        default: '15'
      fps:
        description: 'FPS [1=30, 2=60]'
        required: true
        default: '2'

jobs:
  process-video:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install FFmpeg & yt-dlp
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg curl
          sudo curl -L https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp -o /usr/local/bin/yt-dlp
          sudo chmod a+rx /usr/local/bin/yt-dlp

      - name: Download Video (YouTube or Direct Link)
        run: |
          URL="${{ github.event.inputs.video_url }}"
          echo "📥 Downloading video using yt-dlp..."
          yt-dlp -f "bestvideo[ext=mp4]+bestaudio[ext=mp4]/best[ext=mp4]/best" "$URL" -o "input_video.mp4" || yt-dlp "$URL" -o "input_video.mp4"
          
          if [ ! -f "input_video.mp4" ] || [ ! -s "input_video.mp4" ]; then
            echo "Error: Download failed!"
            exit 1
          fi

      - name: Process and Instant Upload Clips
        run: |
          TITLE_INPUT="${{ github.event.inputs.video_title }}"
          RATIO="${{ github.event.inputs.ratio }}"
          FILTER="${{ github.event.inputs.filter }}"
          SPEED_OPT="${{ github.event.inputs.speed }}"
          CLIP_COUNT=${{ github.event.inputs.clip_count }}
          CLIP_LEN=${{ github.event.inputs.clip_len }}
          FPS_OPT="${{ github.event.inputs.fps }}"

          TAG_NAME="v1.0.${{ github.run_number }}"

          # Crop Ratios
          CROP=""
          if [ "$RATIO" = "1" ]; then CROP="scale=1080:1080:force_original_aspect_ratio=increase,crop=1080:1080,"; fi
          if [ "$RATIO" = "2" ]; then CROP="scale=1080:1350:force_original_aspect_ratio=increase,crop=1080:1350,"; fi
          if [ "$RATIO" = "3" ]; then CROP="scale=1080:1920:force_original_aspect_ratio=increase,crop=1080:1920,"; fi
          if [ "$RATIO" = "4" ]; then CROP="scale=1080:1440:force_original_aspect_ratio=increase,crop=1080:1440,"; fi
          if [ "$RATIO" = "5" ]; then CROP="scale=1440:1080:force_original_aspect_ratio=increase,crop=1440:1080,"; fi

          # Color & Gaming Filters
          GAME=""
          if [ "$FILTER" = "1" ]; then GAME="eq=brightness=0.03:contrast=1.10:saturation=1.24,unsharp=5:5:1.0:5:5:0.0,"; fi
          if [ "$FILTER" = "2" ]; then GAME="eq=brightness=0.01:contrast=1.10:saturation=1.35:gamma=1.1,unsharp=5:5:1.0:5:5:0.0,"; fi
          if [ "$FILTER" = "3" ]; then GAME="eq=brightness=0.05:contrast=1.25,unsharp=5:5:1.5:5:5:0.0,"; fi
          if [ "$FILTER" = "4" ]; then GAME="eq=brightness=0.12:gamma=1.2,"; fi
          if [ "$FILTER" = "5" ]; then GAME="eq=contrast=1.15:saturation=1.1,colorbalance=rs=0.05:bs=-0.05,"; fi
          if [ "$FILTER" = "6" ]; then GAME="eq=contrast=1.2:saturation=1.4,unsharp=7:7:2.5:7:7:0.0,"; fi

          # Speed Control Filter (Video + Audio sync)
          V_SPEED=""
          A_SPEED=""
          if [ "$SPEED_OPT" = "1" ]; then V_SPEED=""; A_SPEED=""; fi
          if [ "$SPEED_OPT" = "2" ]; then V_SPEED="setpts=0.8*PTS,"; A_SPEED="atempo=1.25,"; fi
          if [ "$SPEED_OPT" = "3" ]; then V_SPEED="setpts=0.6666*PTS,"; A_SPEED="atempo=1.5,"; fi
          if [ "$SPEED_OPT" = "4" ]; then V_SPEED="setpts=1.25*PTS,"; A_SPEED="atempo=0.8,"; fi

          # FPS Setup
          FPS="60"
          if [ "$FPS_OPT" = "1" ]; then FPS="30"; fi

          # Final Filter Chain with Speed & Crop & Color
          VF_CHAIN="${V_SPEED}${CROP}${GAME}scale=trunc(iw/2)*2:trunc(ih/2)*2"
          AF_CHAIN="${A_SPEED}aresample=44100"

          # GitHub Release create karna
          gh release create "$TAG_NAME" --title "Clips Rendered: $TITLE_INPUT" --notes "Automated clips for $TITLE_INPUT" || true

          for ((i=1; i<=CLIP_COUNT; i++)); do
            SS=$(( (i-1) * CLIP_LEN ))
            
            CLIP_FILE="${TITLE_INPUT}${i}.mp4"

            echo "🎥 Rendering $CLIP_FILE with Speed, Filters & Metadata..."
            ffmpeg -y -ss $SS -t $CLIP_LEN -i "input_video.mp4" \
              -vf "${VF_CHAIN}" \
              -af "${AF_CHAIN}" \
              -metadata title="${TITLE_INPUT}${i}" \
              -metadata artist="PremxGamer HD" \
              -metadata comment="PremxGamer Clip" \
              -r $FPS -c:v libx264 -crf 18 -preset fast -pix_fmt yuv420p \
              -c:a aac -b:a 128k \
              "$CLIP_FILE"

            echo "🚀 Uploading $CLIP_FILE to Release..."
            gh release upload "$TAG_NAME" "$CLIP_FILE" --clobber
            
            rm -f "$CLIP_FILE"
          done
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Save Video Links to game_links
        run: |
          GAME_NAME="${{ github.event.inputs.game_name }}"
          TITLE_INPUT="${{ github.event.inputs.video_title }}"
          CLIP_COUNT=${{ github.event.inputs.clip_count }}
          TAG_NAME="v1.0.${{ github.run_number }}"
          
          mkdir -p game_links
          FILE_PATH="game_links/history.txt"
          
          for ((i=1; i<=CLIP_COUNT; i++)); do
            RELEASE_URL="https://github.com/${{ github.repository }}/releases/download/${TAG_NAME}/${TITLE_INPUT}${i}.mp4"
            echo "${GAME_NAME}${i} | Link: ${RELEASE_URL}" >> "$FILE_PATH"
          done
          
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add game_links/
          git commit -m "Update links for ${GAME_NAME}" || echo "No changes"
          git push
