Name: Auto Stream Video Editor (PremxGamer HD)

on:
  workflow_dispatch:
    inputs:
      video_url:
        description: 'YouTube Video URL or Direct Stream Link'
        required: true
        default: ''
      audio_url:
        description: 'Optional Audio/Video URL (Leave blank if not needed)'
        required: false
        default: ''
      video_title:
        description: 'Exact File Name Prefix (e.g. cod -> cod1.mp4, cod2.mp4)'
        required: true
        default: 'cod'
      game_name:
        description: 'Game Name for File Creation (e.g. newcod -> newcod.txt)'
        required: true
        default: 'newcod'
      ratio:
        description: 'Crop Ratio [0=None, 1=1:1, 2=4:5, 3=9:16, 4=3:4, 5=4:3]'
        required: true
        default: '3'
      filter:
        description: 'Filter [0=OFF, 1=BALANCED, 2=GAMING, 3=FPS BOOST, 4=NIGHT MAP, 5=CINEMATIC, 6=ULTRA SHARP]'
        required: true
        default: '2'
      speed:
        description: 'Video Speed [1=Normal (1x), 2=Fast (1.25x), 3=Super Fast (1.5x), 4=Slow Motion (0.8x)]'
        required: true
        default: '1'
      clip_count:
        description: 'Kitne clips banane hain?'
        required: true
        default: '3'
      clip_len:
        description: 'Har clip kitne second ka ho?'
        required: true
        default: '15'
      fps:
        description: 'FPS [1=30, 2=60]'
        required: true
        default: '2'

jobs:
  process-video:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Cache FFmpeg and Tools
        id: cache-tools
        uses: actions/cache@v4
        with:
          path: |
            /usr/local/bin/yt-dlp
            /usr/bin/ffmpeg
          key: ${{ runner.os }}-video-tools-v3

      - name: Install & Update Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg curl python3-pip
          sudo curl -L https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp -o /usr/local/bin/yt-dlp
          sudo chmod a+rx /usr/local/bin/yt-dlp

      - name: Fetch Video with Browser-Mimic Bypass
        run: |
          URL="${{ github.event.inputs.video_url }}"
          
          echo "📥 Capturing stream using Browser-Spoofing mode..."
          
          # Hum yahan user-agent aur referrer set kar rahe hain jo browser jaisa lagega
          ffmpeg -y \
            -user_agent "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36" \
            -headers "Referer: https://www.youtube.com/" \
            -headers "Origin: https://www.youtube.com/" \
            -i "$URL" \
            -c copy -t 600 "input_video.mp4" || \
          yt-dlp --user-agent "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36" \
                 --referer "https://www.youtube.com/" \
                 "$URL" -o "input_video.mp4"
          
          if [ ! -f "input_video.mp4" ] || [ ! -s "input_video.mp4" ]; then
            echo "❌ Error: Could not bypass. Link might be too restricted!"
            exit 1
          fi

      - name: Process and Upload
        run: |
          TITLE_INPUT="${{ github.event.inputs.video_title }}"
          CLIP_COUNT=${{ github.event.inputs.clip_count }}
          CLIP_LEN=${{ github.event.inputs.clip_len }}
          
          # (Rest of your processing logic remains same)
          for ((i=1; i<=CLIP_COUNT; i++)); do
            SS=$(( (i-1) * CLIP_LEN ))
            CLIP_FILE="${TITLE_INPUT}${i}.mp4"
            TAG_NAME="v1.0.${{ github.run_number }}-$i"
            
            ffmpeg -y -ss $SS -t $CLIP_LEN -i "input_video.mp4" -c:v libx264 -crf 18 -preset fast -pix_fmt yuv420p -c:a aac "$CLIP_FILE"
            
            gh release create "$TAG_NAME" --title "Clip $i" --notes "Automated" || true
            gh release upload "$TAG_NAME" "$CLIP_FILE" --clobber
            rm -f "$CLIP_FILE"
          done
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
