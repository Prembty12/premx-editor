name: Test Heavy TTS Models

on:
  workflow_dispatch: # GitHub dashboard se manually run karne ke liye

jobs:
  run-tts:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          pip install --upgrade pip
          pip install torch torchvision torchaudio --index-url https://download.pytorch.org/whl/cpu
          pip install transformers[torch] accelerate sentencepiece scipy

      - name: Run TTS Script
        run: |
          python voice.py

      - name: Upload Generated Audio as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: tts-audio-result
          path: '*.wav'
