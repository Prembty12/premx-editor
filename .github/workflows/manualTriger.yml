name: manualTriger

on:
  schedule:
    - cron: '0 */12 * * *'
  workflow_dispatch:
    inputs:
      link:
        description: 'Manual video URL (optional)'
        required: false
        type: string

permissions:
  contents: write

jobs:
  run-ai-agent:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg jq curl

      - name: Install Python Packages
        run: |
          pip install --upgrade pip
          pip install requests Pillow python-dotenv

      - name: Run AI Video Editor
        env:
          GEMINI_API_KEY_1: ${{ secrets.GEMINI_API_KEY_1 }}
          GEMINI_API_KEY_2: ${{ secrets.GEMINI_API_KEY_2 }}
          GEMINI_API_KEY_3: ${{ secrets.GEMINI_API_KEY_3 }}
          GEMINI_API_KEY_4: ${{ secrets.GEMINI_API_KEY_4 }}
          GEMINI_API_KEY_5: ${{ secrets.GEMINI_API_KEY_5 }}
          GEMINI_API_KEY_6: ${{ secrets.GEMINI_API_KEY_6 }}

          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENROUTER_API_KEY_2: ${{ secrets.OPENROUTER_API_KEY_2 }}
          OPENROUTER_API_KEY_3: ${{ secrets.OPENROUTER_API_KEY_3 }}
          OPENROUTER_API_KEY_4: ${{ secrets.OPENROUTER_API_KEY_4 }}
          OPENROUTER_API_KEY_5: ${{ secrets.OPENROUTER_API_KEY_5 }}

          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GROQ_API_KEY_2: ${{ secrets.GROQ_API_KEY_2 }}
          GROQ_API_KEY_3: ${{ secrets.GROQ_API_KEY_3 }}

          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          VOICE_ID: ${{ secrets.VOICE_ID }}

          COMMENTARY_ENABLED: 'true'
          SUBTITLES_ENABLED: 'true'

          MANUAL_LINK: ${{ github.event.inputs.link }}
        run: |
          if [ -n "$MANUAL_LINK" ]; then
            python manual.py --link "$MANUAL_LINK"
          else
            python manual.py --no-prompt
          fi

      - name: Commit and Push Updated Files
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add output/ logs/ used_links/ rejected_links/ game_links_editor/ || true
          git commit -m "🎬 Auto: video generated [skip ci]" || echo "No changes"
          git push || echo "Nothing to push"
