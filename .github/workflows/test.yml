name: YouTube Downloader Fix

on:
  workflow_dispatch:
    inputs:
      video_url:
        description: 'Paste YouTube Video URL'
        required: true
        default: ''

jobs:
  download:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Install FFmpeg & Latest yt-dlp
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg curl python3-pip
          # Sabse latest yt-dlp binary direct download karein (Jo blocks ko todta hai)
          sudo curl -L https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp -o /usr/local/bin/yt-dlp
          sudo chmod a+rx /usr/local/bin/yt-dlp

      - name: Start Download
        env:
          URL: ${{ github.event.inputs.video_url }}
          YOUTUBE_COOKIES: ${{ secrets.YOUTUBE_COOKIES }}
        run: |
          if [ -n "$YOUTUBE_COOKIES" ]; then
            echo "🍪 Using Cookies from Secrets..."
            echo "$YOUTUBE_COOKIES" > cookies.txt
            COOKIE_ARG="--cookies cookies.txt"
          else
            COOKIE_ARG=""
          fi

          echo "📥 Downloading video..."
          # iOS aur Web player client ka use karke bypass karenge
          yt-dlp $COOKIE_ARG \
                 --extractor-args "youtube:player_client=ios,web" \
                 --geo-bypass \
                 -f "bestvideo[ext=mp4]+bestaudio[ext=m4a]/best[ext=mp4]/best" \
                 --merge-output-format mp4 \
                 "$URL" -o "final_video.mp4"

          rm -f cookies.txt

          if [ -f "final_video.mp4" ] && [ -s "final_video.mp4" ]; then
            echo "✅ Success! Video downloaded."
          else
            echo "❌ Failed! YouTube ne block kar diya ya URL galat hai."
            exit 1
          fi

      - name: Upload Video Artifact
        uses: actions/upload-artifact@v4
        with:
          name: youtube-video
          path: final_video.mp4
          retention-days: 1
