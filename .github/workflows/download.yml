name: VLC Stream Capture

on:
  workflow_dispatch:
    inputs:
      video_url:
        description: 'VLC wala videoplayback link yahan dalein:'
        required: true
        type: string

jobs:
  vlc-capture:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install VLC and Virtual Display Tools
        run: |
          sudo apt-get update
          # Yahan 'cvlc' hata kar sirf 'vlc' aur 'xvfb' kar diya hai
          sudo apt-get install -y vlc xvfb

      - name: Stream and Record using VLC via Virtual Screen
        run: |
          STREAM_URL="${{ github.event.inputs.video_url }}"
          
          echo "Starting VLC stream capture..."
          
          # cvlc ab seedha kaam karega kyunki vlc install ho chuka hai
          xvfb-run -a cvlc -I dummy "$STREAM_URL" \
            --sout="#standard{access=file,mux=mp4,dst=vlc_output.mp4}" \
            vlc://quit &
            
          # Video record hone ke liye 60 seconds ka wait karenge (video lambi ho toh ise badha sakte ho)
          sleep 60
          
          # VLC process ko band karenge taaki file save ho jaye
          pkill vlc || true

      - name: Check Output File
        run: |
          ls -lh vlc_output.mp4 || echo "File not found yet"

      - name: Upload Downloaded Video
        uses: actions/upload-artifact@v4
        with:
          name: vlc-captured-video
          path: vlc_output.mp4
