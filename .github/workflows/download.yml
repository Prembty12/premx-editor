name: Test Browser Link

on:
  workflow_dispatch:
    inputs:
      video_url:
        description: 'Direct Link / API Link to Test'
        required: true
        default: ''

jobs:
  test-link:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Playwright & Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgbm-dev
          npm install -g playwright
          npx playwright install --with-deps chromium

      - name: Run Browser Test Script
        run: |
          URL="${{ github.event.inputs.video_url }}"
          echo "🚀 Testing link in headless browser: $URL"

          node -e '
          const { chromium } = require("playwright");

          (async () => {
            const targetUrl = process.env.TARGET_URL;
            console.log("🌐 Launching browser...");
            const browser = await chromium.launch({ headless: true });
            const context = await browser.newContext({
              userAgent: "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/122.0.0.0 Safari/537.36"
            });
            const page = context.defaultBrowserContext ? await context.newPage() : await browser.newPage();

            // Saare network requests aur errors print honge log mein
            page.on("request", req => console.log(➡️ Request: ${req.url()}));
            page.on("response", res => console.log(📥 Response [${res.status()}]: ${res.url()}));
            page.on("pageerror", err => console.log(❌ Page Error: ${err.message}));

            try {
              console.log("🔗 Opening URL...");
              const response = await page.goto(targetUrl, { waitUntil: "networkidle", timeout: 60000 });
              console.log(✅ Page loaded with status: ${response ? response.status() : "unknown"});
              
              // 5 second wait taaki agar koi video stream trigger honi ho toh log mein dikh jaye
              await page.waitForTimeout(5000);
            } catch (err) {
              console.error("❌ Failed to load link:", err);
              process.exit(1);
            } finally {
              await browser.close();
              console.log("🔒 Browser closed.");
            }
          })();
          '
        env:
          TARGET_URL: ${{ github.event.inputs.video_url }}
