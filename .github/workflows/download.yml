name: VLC Stream Capture

on:
  workflow_dispatch:
    inputs:
      video_url:
        description: 'VLC wala videoplayback link yahan dalein:'
        required: true
        type: string

jobs:
  vlc-capture:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Download Stream via FFmpeg with VLC Headers
        run: |
          STREAM_URL="${{ github.event.inputs.video_url }}"
          
          echo "Starting stream download..."
          
          # VLC jaisa User-Agent aur Referer dekar ffmpeg se stream pull karenge
          ffmpeg -user_agent "VLC/3.0.18 LibVLC/3.0.18" \
                 -headers "Referer: https://www.youtube.com/\r\n" \
                 -i "$STREAM_URL" \
                 -c copy \
                 vlc_output.mp4 || true

      - name: Check Output File Size
        run: |
          ls -lh vlc_output.mp4
          # Agar file 1MB se choti hai toh error throw karega taaki pata chale ki download nahi hua
          FILESIZE=$(stat -c%s "vlc_output.mp4" 2>/dev/null || echo 0)
          if [ "$FILESIZE" -lt 1000000 ]; then
            echo "Error: Video file is too small ($FILESIZE bytes). Stream was blocked or failed."
            exit 1
          fi

      - name: Upload Downloaded Video
        uses: actions/upload-artifact@v4
        with:
          name: vlc-captured-video
          path: vlc_output.mp4
