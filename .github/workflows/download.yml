name: Stream and Download Video

on:
  workflow_dispatch:
    inputs:
      video_url:
        description: 'Yahan apna direct videoplayback link paste karo:'
        required: true
        type: string

jobs:
  capture-stream:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Capture and Download Stream via FFmpeg
        run: |
          # User dwara diya gaya link input variable se liya jayega
          STREAM_URL="${{ github.event.inputs.video_url }}"
          
          echo "Connecting to stream and saving..."
          
          # FFmpeg stream ko capture karega aur webm/mp4 format me save karega
          ffmpeg -user_agent "Mozilla/5.0 (SMART-TV; Linux; Tizen 4.0) AppleWebkit/537.36 (KHTML, like Gecko) TV Safari/537.36" \
                 -i "$STREAM_URL" \
                 -c copy \
                 captured_output.webm

      - name: Upload Downloaded Video
        uses: actions/upload-artifact@v4
        with:
          name: downloaded-stream-video
          path: captured_output.webm
