name: SnapScooper 4K Downloader & Merger

on:
  workflow_dispatch:
    inputs:
      video_url:
        description: 'YouTube Video URL'
        required: true
        default: 'https://youtu.be/0dL3067C-Bc'

jobs:
  run-script:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install selenium webdriver-manager

      - name: Run SnapScooper Script
        run: |
          python snaps_auto.py "${{ github.event.inputs.video_url }}"

      - name: Upload Merged Video to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: downloads/*
          tag_name: 4k-video-${{ github.run_number }}
          name: "Merged 4K Video #${{ github.run_number }}"
          body: "High Quality 4K video merged with audio from SnapScooper for URL: ${{ github.event.inputs.video_url }}"
