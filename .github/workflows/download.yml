name: Test Browser Link

on:
  workflow_dispatch:
    inputs:
      video_url:
        description: 'Direct Link / API Link to Test'
        required: true
        default: ''

jobs:
  test-link:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Playwright & Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgbm-dev
          npm install -g playwright
          npx playwright install --with-deps chromium

      - name: Run Browser Test Script
        env:
          TARGET_URL: ${{ github.event.inputs.video_url }}
        run: |
          echo "🚀 Starting test..."
          node -e '
            const { chromium } = require("playwright");

            (async () => {
              const targetUrl = process.env.TARGET_URL;
              console.log("🌐 Target URL:", targetUrl);
              
              if (!targetUrl) {
                console.error("❌ Error: No URL provided!");
                process.exit(1);
              }

              const browser = await chromium.launch({ headless: true });
              const context = await browser.newContext({
                userAgent: "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/122.0.0.0 Safari/537.36"
              });
              const page = await context.newPage();

              page.on("request", req => console.log(`➡️ Request: ${req.url()}`));
              page.on("response", res => console.log(`📥 Response [${res.status()}]: ${res.url()}`));
              page.on("pageerror", err => console.log(`❌ Page Error: ${err.message}`));

              try {
                console.log("🔗 Opening URL in browser...");
                const response = await page.goto(targetUrl, { waitUntil: "commit", timeout: 60000 });
                console.log(`✅ Page reached with status: ${response ? response.status() : "unknown"}`);
                
                await page.waitForTimeout(5000);
              } catch (err) {
                console.error("❌ Failed to load link:", err);
                process.exit(1);
              } finally {
                await browser.close();
                console.log("🔒 Browser closed.");
              }
            })();
          '

