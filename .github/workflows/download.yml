name: Termux Curl Downloader

on:
  workflow_dispatch:
    inputs:
      video_url:
        description: 'Paste Direct Google Video Link'
        required: true
        default: ''

jobs:
  download:
    runs-on: self-hosted   # Yeh zaroori hai taaki kaam aapke phone par ho
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Download Video via Curl on Phone
        env:
          TARGET_URL: ${{ github.event.inputs.video_url }}
        run: |
          echo "=========================================="
          echo "🚀 PremxGamer Direct Link Downloader (Phone)"
          echo "=========================================="

          if [ -z "$TARGET_URL" ]; then
              echo "❌ Error: Link khali nahi ho sakta!"
              exit 1
          fi

          OUTPUT_FILE="downloaded_video.mp4"

          echo "📥 Starting download via curl..."
          
          # Wahi same working curl command jo aapne Termux par chalai thi
          curl -L -C - "$TARGET_URL" \
            -H "User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126.0.0.0 Safari/537.36" \
            -H "Referer: https://www.youtube.com/" \
            -o "$OUTPUT_FILE"

          echo "📊 Checking final file size..."
          ls -lh "$OUTPUT_FILE"
