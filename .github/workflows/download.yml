name: Download Googlevideo with Curl (Termux Style)

on:
  workflow_dispatch:
    inputs:
      video_url:
        description: 'Paste your Googlevideo link here'
        required: true
        type: string

jobs:
  download:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download using Curl with Headers
        run: |
          echo "Starting download with curl and browser headers..."
          curl -L \
            -H "User-Agent: Mozilla/5.0 (Linux; Android 10; K) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Mobile Safari/537.36" \
            -H "Accept: text/html,application/xhtml+xml,application/xml;q=0.9,image/avif,image/webp,image/apng,*/*;q=0.8" \
            -H "Referer: https://www.youtube.com/" \
            -o downloaded_video.mp4 \
            "${{ inputs.video_url }}"
          
          ls -lh downloaded_video.mp4

      - name: Upload file as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: downloaded-video-file
          path: downloaded_video.mp4
          if-no-files-found: ignore
