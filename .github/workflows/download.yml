name: Simple Browser Workflow

on:
  workflow_dispatch:
    inputs:
      website_url:
        description: 'Jis website ko browser mein kholna hai uska link dalein:'
        required: true
        default: 'https://www.youtube.com'
        type: string

jobs:
  run-browser:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Playwright & Dependencies
        run: |
          pip install playwright
          python -m playwright install chromium
          python -m playwright install-deps chromium

      - name: Run Simple Browser Script
        env:
          TARGET_URL: "${{ github.event.inputs.website_url }}"
        run: |
          python - << 'EOF'
          import os
          from playwright.sync_api import sync_playwright

          url = os.environ.get("TARGET_URL")
          print(f"Browser khol raha hai link par: {url}")

          with sync_playwright() as p:
              # Chromium browser launch kar rahe hain
              browser = p.chromium.launch(headless=True)
              page = browser.new_page(
                  user_agent="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/122.0.0.0 Safari/537.36"
              )
              
              try:
                  # Link par jaakar page load hone ka wait karenge
                  page.goto(url, timeout=60000)
                  print(f"Page Title: {page.title()}")
                  
                  # Browser ka screenshot lenge
                  page.screenshot(path="browser_screenshot.png", full_page=True)
                  print("Screenshot successfully save ho gaya hai!")
                  
              except Exception as e:
                  print(f"Error aaya: {e}")
                  page.screenshot(path="browser_screenshot.png")
                  
              browser.close()
          EOF

      - name: Upload Screenshot Artifact
        uses: actions/upload-artifact@v4
        with:
          name: browser-screenshot-result
          path: browser_screenshot.png
