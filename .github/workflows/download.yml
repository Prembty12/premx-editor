name: YouTube Video Downloader

on:
  workflow_dispatch:
    inputs:
      video_url:
        description: 'YouTube Video URL'
        required: true
        default: 'https://youtu.be/QVlHT7_l0e0'

jobs:
  download-video:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12' # Python version updated

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install yt-dlp

    - name: Setup FFmpeg
      uses: AnimMouse/setup-ffmpeg@v1

    # Yahan secret use karna zaroori hai
    - name: Create Cookies File
      run: |
        echo "${{ secrets.YOUTUBE_COOKIES }}" > cookies.txt

    - name: Download Video
      run: |
        # --cookies flag ke saath --user-agent add karna bahut zaroori hai
        # Varna YouTube pehchan leta hai ki ye yt-dlp hai
        yt-dlp --cookies cookies.txt \
               --user-agent "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36" \
               --format "bestvideo+bestaudio/best" \
               "${{ github.event.inputs.video_url }}"

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: video-output
        path: "*.mp4"
