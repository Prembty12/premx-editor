name: Download Video via Playwright Browser
        env:
          TARGET_URL: ${{ github.event.inputs.video_url }}
        run: |
          echo "🚀 Starting browser-based download..."
          node -e '
            const { chromium } = require("playwright");
            const fs = require("fs");
            const https = require("https");
            const http = require("http");

            (async () => {
              const targetUrl = process.env.TARGET_URL;
              console.log("🌐 Target URL:", targetUrl);

              const browser = await chromium.launch({ headless: true });
              const context = await browser.newContext({
                userAgent: "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/122.0.0.0 Safari/537.36"
              });
              const page = await context.newPage();

              let finalVideoUrl = "";

              // Network requests ko intercept karke real media stream URL pakdo
              page.on("response", async response => {
                const url = response.url();
                if (url.includes("videoplayback") && response.status() === 200) {
                  if (!finalVideoUrl) {
                    finalVideoUrl = url;
                    console.log("🎯 Captured Real Stream URL:", finalVideoUrl);
                  }
                }
              });

              try {
                console.log("🔗 Opening URL in browser...");
                await page.goto(targetUrl, { waitUntil: "networkidle", timeout: 60000 });
                await page.waitForTimeout(5000);
              } catch (err) {
                console.log("⚠️ Navigation warning/timeout, checking captured stream...");
              }

              await browser.close();

              if (!finalVideoUrl) {
                console.log("❌ Could not capture stream URL directly, trying original URL...");
                finalVideoUrl = targetUrl;
              }

              console.log("📥 Downloading video file...");
              
              // Node.js se file download karna with proper User-Agent
              const fileStream = fs.createWriteStream("downloaded_video.mp4");
              const client = finalVideoUrl.startsWith("https") ? https : http;

              const req = client.get(finalVideoUrl, {
                headers: {
                  "User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/122.0.0.0 Safari/537.36",
                  "Referer": "https://www.youtube.com/"
                }
              }, res => {
                if (res.statusCode !== 200 && res.statusCode !== 302 && res.statusCode !== 206) {
                  console.error(❌ Download failed with status code: ${res.statusCode});
                  process.exit(1);
                }
                res.pipe(fileStream);
                fileStream.on("finish", () => {
                  fileStream.close();
                  console.log("✅ Video successfully downloaded as downloaded_video.mp4!");
                });
              });

              req.on("error", err => {
                console.error("❌ Download error:", err.message);
                process.exit(1);
              });

            })();
          '
          
          echo "📊 Checking final file..."
          ls -lh downloaded_video.mp4
