name: FFmpeg Stream Recorder

on:
  workflow_dispatch:
    inputs:
      video_url:
        description: 'Apna videoplayback link yahan dalein:'
        required: true
        type: string

jobs:
  ffmpeg-record:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Record Stream using FFmpeg
        run: |
          STREAM_URL="${{ github.event.inputs.video_url }}"
          
          echo "Starting FFmpeg recording..."
          
          # Yahan hum browser/VLC jaisa User-Agent aur headers de rahe hain
          # Taaki YouTube server block na kare
          ffmpeg -y \
                 -user_agent "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36" \
                 -headers "Referer: https://www.youtube.com/" \
                 -i "$STREAM_URL" \
                 -c copy \
                 recorded_video.mp4
                 
      - name: Check Recorded File
        run: |
          ls -lh recorded_video.mp4

      - name: Upload Recorded Video
        uses: actions/upload-artifact@v4
        with:
          name: ffmpeg-recorded-video
          path: recorded_video.mp4
