name: Test Browser Link

on:
  workflow_dispatch:
    inputs:
      video_url:
        description: 'Direct Link / API Link to Test'
        required: true
        default: ''

jobs:
  test-link:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Playwright & Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgbm-dev
          npm init -y
          npm install playwright
          npx playwright install --with-deps chromium

      - name: Download Video via Detailed Debug Script
        run: |
          echo "🚀 Starting detailed debug download..."
          node -e '
            const { chromium } = require("playwright");
            const fs = require("fs");
            
            const targetUrl = "${{ github.event.inputs.video_url }}";
            
            (async () => {
              if (!targetUrl) {
                  console.error("❌ Link input mein nahi mila!");
                  process.exit(1);
              }
              
              console.log("🔗 URL Received (Full):", targetUrl);

              const browser = await chromium.launch({ headless: true });
              const context = await browser.newContext({
                userAgent: "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126.0.0.0 Safari/537.36"
              });
              const page = await context.newPage();

              page.on("response", response => {
                if (response.url().includes("googlevideo.com")) {
                  console.log(`📥 Network Log: [${response.status()}] ${response.url()}`);
                }
              });

              console.log("🔗 Navigating...");
              try {
                const response = await page.goto(targetUrl, { waitUntil: "networkidle", timeout: 120000 });
                console.log("✅ Response Status from Page:", response.status());
                
                const buffer = await page.evaluate(async () => {
                   const response = await fetch(window.location.href);
                   if (!response.ok) throw new Error("Fetch failed with status " + response.status);
                   return await response.arrayBuffer();
                });

                fs.writeFileSync("downloaded_video.mp4", Buffer.from(buffer));
                console.log("✅ Success! File size: " + buffer.byteLength + " bytes");
                
              } catch (err) {
                console.error("❌ FAILED! Error details:", err.message);
                process.exit(1);
              } finally {
                await browser.close();
              }
            })();
          '
          ls -lh downloaded_video.mp4
