name: YouTube Video Downloader

on:
  workflow_dispatch: # GitHub dashboard se manual run karne ke liye

jobs:
  download-video:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install yt-dlp

    - name: Setup FFmpeg (for video + audio merging)
      uses: AnimMouse/setup-ffmpeg@v1

    - name: Create Cookies File from Secrets
      run: |
        echo "${{ secrets.YOUTUBE_COOKIES }}" > cookies.txt

    - name: Download Video via yt-dlp
      run: |
        # Yahan apna YouTube video ka URL daal dein
        VIDEO_URL="https://youtu.be/QVlHT7_l0e0?si=XpiQ3NpxgSsl_hGW"
        
        # QUALITY SETTING: 
        # 'bestvideo+best/best' matlab sabse best quality (1080p/4K) audio ke sath merge ho jayegi
        VIDEO_FORMAT="bestvideo+best/best"

        echo "🚀 Downloading video..."
        yt-dlp --format "$VIDEO_FORMAT" --cookies cookies.txt "$VIDEO_URL"

    - name: Upload Downloaded Video Artifact
      uses: actions/upload-artifact@v4
      with:
        name: downloaded-youtube-video
        path: "*.mp4"
