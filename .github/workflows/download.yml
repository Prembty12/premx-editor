name: Download Googlevideo with Curl

on:
  workflow_dispatch:
    inputs:
      video_url:
        description: 'Paste your Googlevideo link here'
        required: true
        type: string

jobs:
  download:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download using Curl
        run: |
          echo "Starting download with curl..."
          curl -L -o downloaded_video.mp4 "${{ inputs.video_url }}"
          ls -lh downloaded_video.mp4

      - name: Upload file as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: downloaded-video-file
          path: downloaded_video.mp4
          if-no-files-found: ignore
