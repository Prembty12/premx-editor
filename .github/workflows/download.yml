name: Browser Test and Download

on:
  workflow_dispatch:
    inputs:
      video_url:
        description: 'Vahan videoplayback ya YouTube link dalein:'
        required: true
        type: string

jobs:
    test-browser:
      runs-on: ubuntu-latest
  
      steps:
        - name: Checkout Repository
          uses: actions/checkout@v4
  
        - name: Set up Python
          uses: actions/setup-python@v5
          with:
            python-version: '3.10'
  
        - name: Install Dependencies
          run: |
            pip install playwright
            # Direct command ki jagah python module ke zariye install karenge
            python -m playwright install chromium
            python -m playwright install-deps chromium
  
        - name: Run Browser Automation Test
          env:
            TARGET_URL: "${{ github.event.inputs.video_url }}"
          run: |
            python - << 'EOF'
            import os
            from playwright.sync_api import sync_playwright
            
            url = os.environ.get("TARGET_URL")
            print(f"Testing URL in browser: {url}")
            
            with sync_playwright() as p:
                browser = p.chromium.launch(headless=True)
                context = browser.new_context(
                    user_agent="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36"
                )
                page = context.new_page()
                
                try:
                    response = page.goto(url, timeout=30000)
                    print(f"HTTP Status: {response.status}")
                    print(f"Page Title: {page.title()}")
                    
                    page.screenshot(path="browser_test.png")
                    print("Screenshot saved as browser_test.png")
                    
                except Exception as e:
                    print(f"Error loading URL in browser: {e}")
                    
                browser.close()
            EOF
  
        - name: Upload Browser Screenshot Artifact
          uses: actions/upload-artifact@v4
          with:
            name: browser-debug-screenshot
            path: browser_test.png
