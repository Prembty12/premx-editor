name: Manual YouTube Downloader

on:
  workflow_dispatch:
    inputs:
      video_url:
        description: 'YouTube Video URL enter karein'
        required: true
        type: string
        default: 'https://youtu.be/QVlHT7_l0e0?si=XpiQ3NpxgSsl_hGW'

jobs:
  download-video:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install yt-dlp

    - name: Setup FFmpeg (for video + audio merging)
      uses: AnimMouse/setup-ffmpeg@v1

    - name: Download Video via yt-dlp
      run: |
        # GitHub input se URL automatic utha lega
        VIDEO_URL="${{ github.event.inputs.video_url }}"
        VIDEO_FORMAT="bestvideo+best/best"

        echo "🚀 Downloading video from: $VIDEO_URL"
        yt-dlp --format "$VIDEO_FORMAT" "$VIDEO_URL"

    - name: Upload Downloaded Video Artifact
      uses: actions/upload-artifact@v4
      with:
        name: downloaded-youtube-video
        path: "*.mp4"
