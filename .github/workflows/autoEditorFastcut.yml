name: 🎬 Auto Video Editor

on:
  workflow_dispatch:
    inputs:
      video_path:
        description: 'Input video path'
        required: true
        default: 'input/gameplay.mp4'
      frames_per_sec:
        description: 'Frames per second'
        required: true
        default: '3'
      max_grids:
        description: 'Max grid images'
        required: true
        default: '6'
      use_whisper:
        description: 'Use Whisper? (true/false)'
        required: true
        default: 'true'

  push:
    paths:
      - 'input/*.mp4'

permissions:
  contents: write

jobs:
  auto-edit:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout
      - name: 📥 Checkout
        uses: actions/checkout@v4

      # 2. Python
      - name: 🐍 Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      # 3. System deps
      - name: 🔧 Install FFmpeg & ImageMagick
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg imagemagick fonts-dejavu
          sudo sed -i 's/rights="none" pattern="@\*"/rights="read|write" pattern="@*"/' /etc/ImageMagick-6/policy.xml || true

      # 4. Python deps
      - name: 📦 Install Python packages
        run: |
          pip install --upgrade pip
          pip install moviepy==1.0.3 opencv-python==4.8.1.78 Pillow==10.1.0 openai==1.3.0 librosa==0.10.1 openai-whisper==20231117 numpy==1.24.3

      # 5. Auto-create folders
      - name: 📁 Create folders
        run: |
          mkdir -p input
          mkdir -p memes/shocked memes/funny memes/sad memes/victory
          mkdir -p sfx/hype sfx/dramatic sfx/funny sfx/victory
          mkdir -p music grids debug output

      # 6. Run script
      - name: 🎬 Run auto editor
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          python auto_editor.py \
            --video "${{ github.event.inputs.video_path || 'input/gameplay.mp4' }}" \
            --fps "${{ github.event.inputs.frames_per_sec || '3' }}" \
            --grids "${{ github.event.inputs.max_grids || '6' }}" \
            --whisper "${{ github.event.inputs.use_whisper || 'true' }}"

      # 7. Upload output
      - name: 📤 Upload final reel
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: final-reel
          path: |
            output/
            debug/
            grids/
          retention-days: 7
