name: autoEditorFastcut

on:
  workflow_dispatch:
    inputs:
      video_url:
        description: '📥 Video URL'
        required: true
        default: 'https://github.com/Prembty12/premx-editor/releases/download/v1.0.87/Escape.from.Atlas.High.Security.Prison22.mp4'
      frames_per_sec:
        description: 'Frames per second'
        required: true
        default: '3'
      max_grids:
        description: 'Max grid images'
        required: true
        default: '6'
      use_whisper:
        description: 'Use Whisper? (true/false)'
        required: true
        default: 'true'

permissions:
  contents: write

jobs:
  auto-edit:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: 🐍 Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: 🔧 Install FFmpeg & ImageMagick
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg imagemagick fonts-dejavu wget curl
          sudo sed -i 's/rights="none" pattern="@\*"/rights="read|write" pattern="@*"/' /etc/ImageMagick-6/policy.xml || true

      - name: 📦 Install Python packages
        run: |
          python -m pip install --upgrade pip
          python -m pip install moviepy==1.0.3 opencv-python==4.8.1.78 Pillow==10.1.0 librosa==0.10.1 numpy==1.24.3
          python -m pip install openai
          python -m pip install faster-whisper
          python -c "import moviepy, cv2, numpy, librosa, PIL, openai; print('✅ All imports OK')"

      - name: 📁 Create FASTCUT folders
        run: |
          mkdir -p FASTCUT/input FASTCUT/temp_frames
          mkdir -p FASTCUT/memes/shocked FASTCUT/memes/funny FASTCUT/memes/sad FASTCUT/memes/victory
          mkdir -p FASTCUT/memes/reaction FASTCUT/memes/hype FASTCUT/memes/fail FASTCUT/memes/win
          mkdir -p FASTCUT/sfx/hype FASTCUT/sfx/dramatic FASTCUT/sfx/funny FASTCUT/sfx/victory
          mkdir -p FASTCUT/sfx/whoosh FASTCUT/sfx/impact FASTCUT/sfx/notification
          mkdir -p FASTCUT/music FASTCUT/grids FASTCUT/debug FASTCUT/output
          echo "✅ FASTCUT folders ready"
          ls -la FASTCUT/

      - name: 📥 Download video
        run: |
          VIDEO_URL="${{ github.event.inputs.video_url }}"
          curl -L -o FASTCUT/temp_frames/gameplay.mp4 "$VIDEO_URL"
          if [ -f "FASTCUT/temp_frames/gameplay.mp4" ]; then
            echo "✅ Video: $(ls -lh FASTCUT/temp_frames/gameplay.mp4 | awk '{print $5}')"
          else
            echo "❌ Download failed!"
            exit 1
          fi

      - name: 🎬 Run auto editor
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENROUTER_API_KEY_2: ${{ secrets.OPENROUTER_API_KEY_2 }}
          OPENROUTER_API_KEY_3: ${{ secrets.OPENROUTER_API_KEY_3 }}
          OPENROUTER_API_KEY_4: ${{ secrets.OPENROUTER_API_KEY_4 }}
          OPENROUTER_API_KEY_5: ${{ secrets.OPENROUTER_API_KEY_5 }}
        run: |
          python autoEditorFastcut.py \
            --video "FASTCUT/temp_frames/gameplay.mp4" \
            --fps "${{ github.event.inputs.frames_per_sec }}" \
            --grids "${{ github.event.inputs.max_grids }}" \
            --whisper "${{ github.event.inputs.use_whisper }}"

      - name: 🏷️ Rename output with timestamp
        id: rename
        run: |
          TIMESTAMP=$(date +'%Y%m%d-%H%M%S')
          NEW_NAME="reel-${TIMESTAMP}.mp4"
          mv "FASTCUT/output/final_reel.mp4" "FASTCUT/output/${NEW_NAME}"
          echo "filename=${NEW_NAME}" >> $GITHUB_OUTPUT
          echo "📌 Renamed to: ${NEW_NAME}"

      - name: 📤 Upload to Release v1.6
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.6
          name: "🎬 Reel Collection — v1.6"
          body: |
            ## 🎬 Auto-Generated Reels Collection

            **Latest Run:**
            - Source: ${{ github.event.inputs.video_url }}
            - FPS: ${{ github.event.inputs.frames_per_sec }}
            - Grids: ${{ github.event.inputs.max_grids }}
            - Whisper: ${{ github.event.inputs.use_whisper }}

            **Run Link:** [View](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})
          files: |
            FASTCUT/output/${{ steps.rename.outputs.filename }}
          draft: false
          prerelease: false
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 🧹 Cleanup (storage save)
        if: always()
        run: |
          rm -rf FASTCUT/output/ FASTCUT/debug/ FASTCUT/grids/ FASTCUT/temp_frames/
          echo "✅ Cleaned up temp files"
