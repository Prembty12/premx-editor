name: autoEditorFastcut

on:
  workflow_dispatch:
    inputs:
      video_url:
        description: '📥 Video URL (optional — leave empty to use existing)'
        required: false
        default: ''
      frames_per_sec:
        description: 'Frames per second'
        required: true
        default: '3'
      max_grids:
        description: 'Max grid images'
        required: true
        default: '6'
      use_whisper:
        description: 'Use Whisper? (true/false)'
        required: true
        default: 'true'

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  auto-edit:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 1

      - name: 🐍 Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: 🔧 Install FFmpeg & ImageMagick
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg imagemagick fonts-dejavu wget curl
          sudo sed -i 's/rights="none" pattern="@\*"/rights="read|write" pattern="@*"/' /etc/ImageMagick-6/policy.xml || true

      - name: 📦 Install Python packages
        run: |
          python -m pip install --upgrade pip
          python -m pip install moviepy==1.0.3 opencv-python==4.8.1.78 Pillow==10.1.0 librosa==0.10.1 numpy==1.24.3
          python -m pip install openai
          python -m pip install faster-whisper
          python -c "import moviepy, cv2, numpy, librosa, PIL, openai; print('✅ All imports OK')"

      - name: 📥 Download or use existing video
        run: |
          mkdir -p FASTCUT/temp_frames
          VIDEO_URL="${{ github.event.inputs.video_url }}"
          EXISTING="FASTCUT/temp_frames/gameplay.mp4"

          if [ -z "$VIDEO_URL" ]; then
            if [ -f "$EXISTING" ]; then
              echo "✅ Using EXISTING video: $(ls -lh $EXISTING | awk '{print $5}')"
            else
              echo "❌ No video_url AND no existing gameplay.mp4"
              exit 1
            fi
          else
            echo "📥 Downloading new video..."
            rm -f "$EXISTING"
            curl -L --retry 3 --retry-delay 5 -o "$EXISTING" "$VIDEO_URL"
            echo "✅ Downloaded: $(ls -lh $EXISTING | awk '{print $5}')"
          fi

      - name: 🎬 Run auto editor
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENROUTER_API_KEY_2: ${{ secrets.OPENROUTER_API_KEY_2 }}
          OPENROUTER_API_KEY_3: ${{ secrets.OPENROUTER_API_KEY_3 }}
          OPENROUTER_API_KEY_4: ${{ secrets.OPENROUTER_API_KEY_4 }}
          OPENROUTER_API_KEY_5: ${{ secrets.OPENROUTER_API_KEY_5 }}
          GITHUB_ACTIONS: "true"
        run: |
          python autoEditorFastcut.py \
            --video "FASTCUT/temp_frames/gameplay.mp4" \
            --fps "${{ github.event.inputs.frames_per_sec }}" \
            --grids "${{ github.event.inputs.max_grids }}" \
            --whisper "${{ github.event.inputs.use_whisper }}"

      - name: 🏷️ Rename output
        id: rename
        if: success()
        run: |
          TIMESTAMP=$(date +'%Y%m%d-%H%M%S')
          NEW_NAME="reel-${TIMESTAMP}.mp4"
          if [ -f "FASTCUT/output/final_reel.mp4" ]; then
            mv "FASTCUT/output/final_reel.mp4" "FASTCUT/output/${NEW_NAME}"
            echo "filename=${NEW_NAME}" >> $GITHUB_OUTPUT
            echo "📌 Renamed to: ${NEW_NAME}"
          else
            echo "❌ No output file"
            exit 1
          fi

      - name: 📤 Upload to Release v1.6
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.6
          name: "🎬 Reel Collection — v1.6"
          files: |
            FASTCUT/output/${{ steps.rename.outputs.filename }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # ⭐ GRID SAVE — ALWAYS RUNS
      - name: 🖼️ Save Latest Grids to GitHub
        if: always()
        run: |
          git config --local user.email "actions@github.com"
          git config --local user.name "github-actions[bot]"

          rm -rf FASTCUT/grid_history/latest
          mkdir -p FASTCUT/grid_history/latest

          if [ -d "FASTCUT/grids" ] && ls FASTCUT/grids/*.jpg >/dev/null 2>&1; then
            cp FASTCUT/grids/*.jpg FASTCUT/grid_history/latest/
            echo "✅ Copied $(ls FASTCUT/grid_history/latest/*.jpg | wc -l) grids"
          else
            echo "⚠️  No grids found"
          fi

          if [ -d "FASTCUT/debug" ] && ls FASTCUT/debug/*.txt >/dev/null 2>&1; then
            cp FASTCUT/debug/*.txt FASTCUT/grid_history/latest/ 2>/dev/null || true
            cp FASTCUT/debug/*.json FASTCUT/grid_history/latest/ 2>/dev/null || true
            echo "✅ Copied debug logs"
          fi

          {
            echo "Timestamp: $(date +'%Y-%m-%d %H:%M:%S')"
            echo "Run ID: ${{ github.run_id }}"
          } > FASTCUT/grid_history/latest/run_info.txt

          git add FASTCUT/grid_history/
          git diff --cached --quiet || git commit -m "🖼️ Auto: Latest grids [skip ci]"

          git pull --rebase --no-edit origin main || true
          git push || echo "Push failed (but grids saved locally)"

      - name: 🧹 Cleanup
        if: always()
        run: |
          rm -rf FASTCUT/grids/*.jpg
          rm -rf FASTCUT/debug/*.json FASTCUT/debug/*.txt
          rm -rf FASTCUT/output/*.mp4
          echo "✅ Cleaned temp files"
