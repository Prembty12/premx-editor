name: YTGot Automation

on:
  workflow_dispatch:
    inputs:
      video_url:
        description: 'YouTube Video URL'
        required: true
        default: 'https://youtu.be/0dL3067C-Bc'

jobs:
  run-script:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install selenium webdriver-manager

      - name: Run Downloader Script
        run: |
          python ytgot_auto.py "${{ github.event.inputs.video_url }}"

      - name: Upload Screenshot Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ytgot-screenshot
          path: ytgot_screenshot.png
