name: YTGot Automation

on:
  workflow_dispatch:
    inputs:
      yt_link:
        description: 'YouTube Video Link'
        required: true
        default: 'https://youtu.be/...'

jobs:
  run-script:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install selenium webdriver-manager

    - name: Run Downloader Script
      run: |
        python ytgot_auto.py "${{ github.event.inputs.yt_link }}"
