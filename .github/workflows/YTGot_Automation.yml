name: YTGot Automation & Release

on:
  workflow_dispatch:
    inputs:
      video_url:
        description: 'YouTube Video URL'
        required: true
        default: 'https://youtu.be/0dL3067C-Bc'

jobs:
  run-script:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # Releases mein file upload karne ke liye permission zaroori hai

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install selenium webdriver-manager

      - name: Run Downloader Script
        run: |
          python ytgot_auto.py "${{ github.event.inputs.video_url }}"

      - name: Upload Video to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: downloads/*
          tag_name: video-download-${{ github.run_number }}
          name: "Downloaded Video #${{ github.run_number }}"
          body: "Automated download from YTGot for URL: ${{ github.event.inputs.video_url }}"
