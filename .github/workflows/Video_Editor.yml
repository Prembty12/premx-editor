- name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install System Dependencies & Google Chrome
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg curl python3-pip jq wget unzip libxi6 libnss3
          
          wget https://dl.google.com/linux/direct/google-chrome-stable_current_amd64.deb
          sudo apt-get install -y ./google-chrome-stable_current_amd64.deb
          rm google-chrome-stable_current_amd64.deb
          
          pip install selenium webdriver-manager opencv-python
          
          sudo curl -L https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp -o /usr/local/bin/yt-dlp
          sudo chmod a+rx /usr/local/bin/yt-dlp

      - name: Create Browser Downloader Script
        run: |
          cat << 'EOF' > download_via_browser.py
          import time
          import sys
          import os
          from selenium import webdriver
          from selenium.webdriver.chrome.service import Service
          from selenium.webdriver.common.by import By
          from selenium.webdriver.support.ui import WebDriverWait
          from selenium.webdriver.support import expected_conditions as EC
          from webdriver_manager.chrome import ChromeDriverManager

          def download_video_fully(youtube_url):
              print("Browser shuru ho raha hai...")
              
              download_dir = os.path.join(os.getcwd(), "downloads")
              os.makedirs(download_dir, exist_ok=True)
              
              options = webdriver.ChromeOptions()
              options.add_argument("--headless=new")
              options.add_argument("--no-sandbox")
              options.add_argument("--disable-dev-shm-usage")
              options.add_argument("--window-size=1920,1080")
              
              prefs = {
                  "download.default_directory": download_dir,
                  "download.prompt_for_download": False,
                  "download.directory_upgrade": True,
                  "safebrowsing.enabled": True
              }
              options.add_experimental_option("prefs", prefs)
              
              driver = webdriver.Chrome(service=Service(ChromeDriverManager().install()), options=options)
              
              try:
                  print("Website khol rahe hain: https://ytgot.com/")
                  driver.get("https://ytgot.com/")
                  time.sleep(5)
                  
                  wait = WebDriverWait(driver, 25)
                  
                  print("Input box mein link paste kiya ja raha hai...")
                  search_box = wait.until(EC.presence_of_element_located((By.XPATH, "//input[@type='text' or contains(@placeholder, 'Paste')]")))
                  search_box.clear()
                  search_box.send_keys(youtube_url)
                  print("Link successfully paste ho gaya!")
                  
                  time.sleep(2)
                  
                  print("Initial Download button par click kar rahe hain...")
                  download_btn = wait.until(EC.element_to_be_clickable((By.XPATH, "//button[contains(., 'Download')]")))
                  driver.execute_script("arguments[0].scrollIntoView(true);", download_btn)
                  time.sleep(1)
                  driver.execute_script("arguments[0].click();", download_btn)
                  
                  print("10 seconds wait kar rahe hain taaki 'Start' button load ho jaye...")
                  time.sleep(10)
                  
                  print("'Start' button par click kar rahe hain...")
                  start_clicked = False
                  
                  for i in range(15):
                      try:
                          start_buttons = driver.find_elements(By.XPATH, "//button[contains(., 'Start')]")
                          for btn in start_buttons:
                              if btn.is_displayed():
                                  driver.execute_script("arguments[0].scrollIntoView(true);", btn)
                                  time.sleep(1)
                                  driver.execute_script("arguments[0].click();", btn)
                                  start_clicked = True
                                  print("Start button par successfully click ho gaya!")
                                  break
                          if start_clicked:
                              break
                      except:
                          time.sleep(2)
                          
                  if start_clicked:
                      print("Video download ho rahi hai, 35 seconds wait karte hain...")
                      time.sleep(35)
                      
                      files = os.listdir(download_dir)
                      print(f"Downloads folder ki files: {files}")
                  else:
                      print("Error: 'Start' button nahi mila.")

              except Exception as e:
                  import traceback
                  print(f"\nCRITICAL ERROR DETAILS:")
                  traceback.print_exc()
              finally:
                  driver.quit()

          if __name__ == "__main__":
              if len(sys.argv) > 1:
                  link = sys.argv[1]
              else:
                  link = input("YouTube ka link yahan paste karein: ")
              download_video_fully(link)
          EOF

      - name: Fully Auto Fetch Video and Verify Resolution
        run: |
          URL="${{ github.event.inputs.video_url }}"
          METHOD="${{ github.event.inputs.download_method }}"
          TARGET_RES="${{ github.event.inputs.target_resolution }}"
          AUDIO_URL="${{ github.event.inputs.audio_url }}"
          
          if [ "$METHOD" = "1" ]; then
            echo "🚀 Downloading via ytgot.com browser automation..."
            python3 download_via_browser.py "$URL" || true
            
            if [ -d "downloads" ]; then
              find downloads/ -type f \( -name "*.mp4" -o -name "*.mkv" -o -name "*.webm" \) -exec mv {} input_video.mp4 \; || true
            fi
          fi
          
          if [[ "$URL" == *"videodownapi.com"* ]] || [[ "$URL" == *"download"* ]] && [ ! -f "input_video.mp4" ]; then
            echo "🔗 Direct Downloader API link detected. Downloading via curl..."
            curl -L -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64)" "$URL" -o "input_video.mp4" || \
            wget --user-agent="Mozilla/5.0" "$URL" -O "input_video.mp4"
          fi
          
          # Sirf tabhi yt-dlp chalega jab browser/api se download na ho aur URL koi direct media file ho (YouTube link na ho)
          if [ ! -f "input_video.mp4" ] || [ ! -s "input_video.mp4" ]; then
            if [[ "$URL" == *"youtube.com"* ]] || [[ "$URL" == *"youtu.be"* ]]; then
              echo "❌ Error: ytgot.com se video download nahi ho payi. YouTube direct link par yt-dlp block kar raha hai."
              echo "🛑 Kripya ytgot.com par ensure karein ki video properly load ho rahi hai, ya direct download link use karein."
              exit 1
            else
              echo "🔄 Fallback extraction..."
              yt-dlp --geo-bypass --no-check-certificates "$URL" -o "input_video.mp4" || true
            fi
          fi
          
          if [ ! -f "input_video.mp4" ] || [ ! -s "input_video.mp4" ]; then
            echo "Error: Failed to fetch video completely!"
            exit 1
          fi

          # 📐 Resolution Verification & 1080p Check Step
          echo "📐 Checking downloaded video resolution..."
          VIDEO_WIDTH=$(ffprobe -v error -select_streams v:0 -show_entries stream=width -of default=noprint_wrappers=1:nokey=1 input_video.mp4)
          VIDEO_HEIGHT=$(ffprobe -v error -select_streams v:0 -show_entries stream=height -of default=noprint_wrappers=1:nokey=1 input_video.mp4)
          
          echo "📊 Downloaded Video Resolution: ${VIDEO_WIDTH}x${VIDEO_HEIGHT}"

          if [ -n "$TARGET_RES" ]; then
            echo "🎯 Target Required Resolution Height: ${TARGET_RES}p"
            if [ "$VIDEO_HEIGHT" -lt "$TARGET_RES" ]; then
              echo "❌ ERROR: Downloaded video resolution height (${VIDEO_HEIGHT}p) is below target resolution (${TARGET_RES}p)!"
              echo "🛑 Script stopped and download cancelled due to low resolution."
              exit 1
            else
              echo "✅ Resolution is ${VIDEO_HEIGHT}p (meets or exceeds target ${TARGET_RES}p)!"
            fi
          fi
